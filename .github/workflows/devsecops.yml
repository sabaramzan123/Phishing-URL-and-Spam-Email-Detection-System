name: DevSecOps Security Pipeline

# Trigger pipeline on push and pull requests to main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ============================================================================
  # Job 1: SAST (Static Application Security Testing) using Semgrep
  # Scans source code for security flaws, bugs, and insecure patterns
  # ============================================================================
  semgrep-sast:
    name: Semgrep SAST Code Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep Security Rules
        run: semgrep scan --config auto

  # ============================================================================
  # Job 2: Vulnerability Scanning using Trivy
  # Scans dependencies and Docker container image for known CVEs
  # ============================================================================
  trivy-security:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Scan Dependencies & Repository with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          format: "table"
          severity: "CRITICAL,HIGH"

      - name: Build Backend Docker Image
        run: |
          docker build -t phishguard-backend:latest -f Phishing_Spam_NLP_InfoSec/Dockerfile.backend Phishing_Spam_NLP_InfoSec

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "phishguard-backend:latest"
          format: "table"
          severity: "CRITICAL,HIGH"
