name: "04 - Terraform Destroy Infrastructure (Manual)"

# ==============================================================================
# Workflow 4: Manual Infrastructure Destruction & Teardown
# ------------------------------------------------------------------------------
# Triggers on:
#   - STRICTLY manual trigger via workflow_dispatch ONLY (Never runs automatically)
#
# Safety Mechanism:
#   - Requires user confirmation input ('destroy') before deleting resources.
#
# Purpose:
#   - Safely tears down all AWS resources (ALB, ECS, ECR, VPC, Subnets)
#   - Prevents accidental cloud bills and keeps project cost at $0.00.
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type 'destroy' to confirm destroying all AWS infrastructure"
        required: true
        default: "destroy"

jobs:
  terraform-destroy:
    name: "Terraform Destroy"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/prod

    steps:
      - name: "Validate User Confirmation"
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "destroy" ]; then
            echo "❌ Confirmation failed. You must type 'destroy' to run this workflow."
            exit 1
          fi
          echo "✅ Confirmation verified. Proceeding with infrastructure teardown..."

      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: "Setup Terraform CLI"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: "Initialize Terraform with S3 Remote Backend"
        run: terraform init

      - name: "Terraform Destroy (Delete All AWS Resources)"
        run: terraform destroy -auto-approve

      - name: "Tear-down Complete"
        run: |
          echo "=========================================================="
          echo "All AWS infrastructure has been cleanly destroyed."
          echo "Current AWS running cost for this project: \$0.00."
          echo "=========================================================="
          echo "### 🛑 Infrastructure Teardown Complete" >> $GITHUB_STEP_SUMMARY
          echo "All AWS resources (VPC, Subnets, ALB, ECS, ECR) have been terminated." >> $GITHUB_STEP_SUMMARY
          echo "**Project AWS Cost: \$0.00**" >> $GITHUB_STEP_SUMMARY

