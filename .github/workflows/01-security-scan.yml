name: "01 - DevSecOps Security Scan (SAST & SCA)"

# ==============================================================================
# Workflow 1: Application Security & Container Scanning
# ------------------------------------------------------------------------------
# Triggers on:
#   1. Push to main branch
#   2. Pull requests to main branch
#   3. Manual trigger via workflow_dispatch
#
# Tools Used:
#   - Semgrep: Static Application Security Testing (SAST) for source code bugs
#   - Trivy: Software Composition Analysis (SCA) & Container Image vulnerability scan
# ==============================================================================

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Semgrep SAST Code Scan
  # ----------------------------------------------------------------------------
  semgrep-sast:
    name: "Semgrep SAST Code Scan"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Set up Python Environment"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install Semgrep"
        run: pip install semgrep

      - name: "Run Semgrep Security Rules"
        run: |
          echo "Scanning application source code for security vulnerabilities..."
          semgrep scan --config auto

  # ----------------------------------------------------------------------------
  # Job 2: Trivy SCA & Container Image Vulnerability Scan
  # ----------------------------------------------------------------------------
  trivy-security:
    name: "Trivy Vulnerability Scan"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Scan Repository Dependencies (Filesystem Scan)"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          format: "table"
          severity: "CRITICAL,HIGH"

      - name: "Build Backend Docker Image"
        run: |
          docker build -t phishguard-backend:latest -f Phishing_Spam_NLP_InfoSec/Dockerfile.backend Phishing_Spam_NLP_InfoSec

      - name: "Scan Docker Container Image with Trivy"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "phishguard-backend:latest"
          format: "table"
          severity: "CRITICAL,HIGH"

